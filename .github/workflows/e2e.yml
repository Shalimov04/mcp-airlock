name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [postgres, grafana]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./e2e/${{ matrix.stack }}/run.sh
