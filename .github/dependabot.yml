version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # the otlp exporter pins opentelemetry-sdk to its own minor, so these must move together
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]
