[project]
name = "mcp-airlock"
version = "0.1.0"
description = "Stateless governance proxy for MCP (2026-07-28): policy, dry-run, human confirmation, audit, tracing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shalimov04" }]
keywords = ["mcp", "model-context-protocol", "proxy", "governance", "human-in-the-loop", "dry-run", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pyjwt>=2.10",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.44.0"]

[project.urls]
Repository = "https://github.com/Shalimov04/mcp-airlock"
Issues = "https://github.com/Shalimov04/mcp-airlock/issues"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[project.scripts]
mcp-airlock = "mcp_airlock.__main__:main"
airlock-audit = "mcp_airlock.audit_cli:main"
airlock-policy = "mcp_airlock.policy_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
