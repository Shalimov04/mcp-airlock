# Isolated e2e: everything on one internal network, no published ports.
# Every Python container runs the airlock image built from the repo Dockerfile (it already has the MCP SDK,
# psycopg, pyjwt and httpx), with this directory mounted read-only at /e2e.
name: airlock-e2e-pg

x-airlock: &airlock
  image: mcp-airlock-e2e:local
  command: ["--policy", "/e2e/policy.yaml", "--upstream", "http://service:8000/mcp", "--env", "prod",
            "--audit", "/data/audit.jsonl", "--otel-file", "/data/spans.jsonl", "--strict"]
  volumes: ["./:/e2e:ro"]
  networks: [e2e]
  depends_on:
    airlock-db: {condition: service_healthy}
    service: {condition: service_started}
    webhook: {condition: service_started}

x-env: &airlock-env
  AIRLOCK_SECRET: e2e-shared-confirm-secret-0123456789
  AIRLOCK_JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789
  AIRLOCK_STORE_DSN: postgresql://airlock:airlock@airlock-db:5432/airlock
  AIRLOCK_AUDIT_DSN: postgresql://airlock:airlock@airlock-db:5432/airlock
  AIRLOCK_APPROVAL_WEBHOOK: http://webhook:8080/hook

networks:
  e2e:
    internal: true

services:
  data-db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    networks: [e2e]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "app"], interval: 1s, retries: 60}

  airlock-db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: airlock, POSTGRES_PASSWORD: airlock, POSTGRES_DB: airlock}
    networks: [e2e]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airlock"], interval: 1s, retries: 60}

  service:
    image: mcp-airlock-e2e:local
    entrypoint: ["python", "/e2e/service.py"]
    environment: {DATA_DSN: "postgresql://app:app@data-db:5432/app"}
    volumes: ["./:/e2e:ro"]
    networks: [e2e]
    restart: "no"
    depends_on:
      data-db: {condition: service_healthy}

  webhook:
    image: mcp-airlock-e2e:local
    entrypoint: ["python", "/e2e/webhook.py"]
    volumes: ["./:/e2e:ro"]
    networks: [e2e]

  airlock-a:
    <<: *airlock
    environment:
      <<: *airlock-env
      AIRLOCK_PUBLIC_URL: http://airlock-a:9000
      AIRLOCK_APPROVAL_MODE: inband  # most scenarios approve by accepting in-band; 07 covers the link

  airlock-b:
    <<: *airlock
    environment:
      <<: *airlock-env
      AIRLOCK_PUBLIC_URL: http://airlock-b:9000
      AIRLOCK_APPROVAL_MODE: inband  # most scenarios approve by accepting in-band; 07 covers the link

  airlock-oob:  # no AIRLOCK_APPROVAL_MODE: with a webhook the default is oob (scenario 15)
    <<: *airlock
    user: root  # the audit volume is created root-owned
    command: ["--policy", "/e2e/policy.yaml", "--upstream", "http://service:8000/mcp", "--env", "prod",
              "--audit", "/audit/oob.jsonl", "--audit-max-bytes", "30000", "--audit-keep", "50",  # small limit so scenario 24 sees rotations
              "--otel-file", "/data/spans.jsonl", "--strict"]
    volumes: ["./:/e2e:ro", "audit:/audit"]
    environment:
      <<: *airlock-env
      AIRLOCK_PUBLIC_URL: http://airlock-oob:9000

  pin-init:  # pins the service's tools with the real command, then changes one pin the way a changed description would
    image: mcp-airlock-e2e:local
    user: root
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        i=0
        until airlock-policy pin /e2e/policy.yaml --upstream http://service:8000/mcp --pins /pins/pins.json; do
          i=$$((i + 1)); [ $$i -lt 60 ] || exit 1; sleep 1
        done
        python -c "import json; p = '/pins/pins.json'; d = json.load(open(p)); d['get_note'] = 'sha256:' + '0' * 64; json.dump(d, open(p, 'w'))"
    volumes: ["./:/e2e:ro", "pins:/pins"]
    networks: [e2e]
    depends_on:
      service: {condition: service_started}

  airlock-pins:  # airlock-a plus a pins file in which get_note no longer matches (scenario 19)
    <<: *airlock
    volumes: ["./:/e2e:ro", "pins:/pins:ro"]
    depends_on:
      airlock-db: {condition: service_healthy}
      service: {condition: service_started}
      webhook: {condition: service_started}
      pin-init: {condition: service_completed_successfully}
    environment:
      <<: *airlock-env
      AIRLOCK_PUBLIC_URL: http://airlock-pins:9000
      AIRLOCK_APPROVAL_MODE: inband
      AIRLOCK_PINS: /pins/pins.json
      AIRLOCK_MAX_UPSTREAM_BYTES: "200000"  # far below the 8 MiB default, so scenario 21 can overflow it with one note

  airlock-reload:  # airlock-a with its policy copied to a volume the runner can rewrite; a wrapper turns /reload/hup into SIGHUP (scenario 23)
    <<: *airlock
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /reload/policy.yaml ] || cp /e2e/policy.yaml /reload/policy.yaml
        mcp-airlock --host 0.0.0.0 --policy /reload/policy.yaml --upstream http://service:8000/mcp --env prod \
          --audit /data/audit.jsonl --otel-file /data/spans.jsonl --strict &
        pid=$$!
        trap 'kill $$pid' TERM INT
        while kill -0 $$pid 2>/dev/null; do
          if [ -f /reload/hup ]; then rm -f /reload/hup; kill -HUP $$pid; fi
          sleep 0.2
        done
        wait $$pid
    volumes: ["./:/e2e:ro", "reload:/reload"]
    environment:
      <<: *airlock-env
      AIRLOCK_PUBLIC_URL: http://airlock-reload:9000
      AIRLOCK_APPROVAL_MODE: inband

  runner:
    image: mcp-airlock-e2e:local
    user: root
    entrypoint: ["python", "-u", "/e2e/scenarios.py"]
    environment:
      AIRLOCK_A: http://airlock-a:9000/mcp
      AIRLOCK_B: http://airlock-b:9000/mcp
      AIRLOCK_OOB: http://airlock-oob:9000/mcp
      AIRLOCK_PINS_URL: http://airlock-pins:9000/mcp
      AIRLOCK_RELOAD_URL: http://airlock-reload:9000/mcp
      AIRLOCK_JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789
      DATA_DSN: postgresql://app:app@data-db:5432/app
      AUDIT_DSN: postgresql://airlock:airlock@airlock-db:5432/airlock
      WEBHOOK: http://webhook:8080/
    volumes: ["./:/e2e:ro", "reload:/reload", "audit:/audit:ro"]
    networks: [e2e]
    profiles: [runner]
    depends_on: [airlock-a, airlock-b, airlock-oob, airlock-pins, airlock-reload]

volumes:
  pins:
  reload:
  audit:
