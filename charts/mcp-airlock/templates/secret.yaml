{{- if not .Values.existingSecret }}
{{- /* lookup keeps the key across upgrades: a new key would void every token already issued.
       It returns an empty map under helm template, hence the default. */ -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "mcp-airlock.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-airlock.fullname" . }}
  labels:
    {{- include "mcp-airlock.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.generateJwtSecret }}
data:
  AIRLOCK_JWT_SECRET: {{ get (default dict $old.data) "AIRLOCK_JWT_SECRET" | default (randAlphaNum 64 | b64enc) }}
{{- else }}
data: {}
{{- end }}
{{- end }}
